name: Refresh league data

# Pull the latest league data and rebuild the processed JSON.
on:
  schedule:
    - cron: "0 11 * * *"   # daily, ~6-7am US Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache NFL player DB (fetched at most once a day)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.day.outputs.d }}
          restore-keys: players-
      - run: python scripts/fetch.py
      - run: python scripts/nfl_injuries.py
      - run: python scripts/nfl_context.py
      - run: python scripts/score.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
